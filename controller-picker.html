<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a game location</title><link rel="stylesheet" href="controller-navigation.css"><style>
*{box-sizing:border-box}body{margin:0;padding:30px 34px 75px;background:#111827;color:#f2f1f6;font:16px "Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;gap:16px}h1{font-size:26px;font-weight:300;margin:0}button,input,select{font:inherit;color:inherit;background:#ffffff09;border:1px solid #ffffff24;border-radius:8px;padding:12px;cursor:pointer}input{flex:1;min-width:0;cursor:text}nav{display:flex;gap:12px}#entries{flex:1;overflow:auto;display:grid;grid-template-columns:1fr;align-content:start;gap:8px;padding:8px}#entries button{text-align:left;display:flex;gap:14px;align-items:center;overflow-wrap:anywhere}#entries button:hover{background:#ffffff18}#entries small{color:#aaa}footer{display:flex;justify-content:flex-end;gap:12px}#message{min-height:22px;margin:0;color:#d8c79f;font-size:14px}#chooseFolder{background:#d9c18f;color:#161b26}button:disabled{opacity:.4}header{display:flex;align-items:center;justify-content:space-between}
</style></head><body><header><h1 id="title">Choose a game location</h1><button id="cancel">Cancel</button></header><nav><button id="parent">↑ Parent folder</button><select id="drives" aria-label="Choose a drive"></select><input id="path" type="text" aria-label="Folder path"><button id="go">Open</button></nav><p id="message" role="status"></p><div id="entries" aria-label="Files and folders"></div><footer><button id="chooseFolder" hidden>Choose this folder</button></footer><script src="controller-picker.js"></script><script src="controller-navigation.js"></script></body></html>
